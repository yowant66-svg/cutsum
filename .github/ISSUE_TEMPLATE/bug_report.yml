name: Bug report
description: Report reproducible incorrect behavior in CutSum.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, private media, or sensitive transcripts. Report security issues privately to yowant66@gmail.com.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command or SDK call, expected behavior, and actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CutSum version
      placeholder: 0.1.0a1
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic or shareable inputs only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and FFmpeg/ffprobe versions if relevant.
    validations:
      required: true
