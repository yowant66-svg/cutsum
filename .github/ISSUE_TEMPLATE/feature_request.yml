name: Feature request
description: Propose a focused improvement to CutSum.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the real workflow and the limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the observable result rather than prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example or evidence
      description: Use public, synthetic, or clearly licensed examples only.
