[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cutsum"
version = "0.1.0a3"
description = "Provider-neutral, strategy-neutral long-video planning and media execution engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "DXBATM", email = "yowant66@gmail.com" }]
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.scripts]
cutup = "universal_cutup.cli:app"
cutsum = "universal_cutup.cli:app"

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "hypothesis>=6.135,<7",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "pytest-timeout>=2.4,<3",
  "reuse>=5.0,<6",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_cutup"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
timeout = 30
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "examples"]
exclude = ["reports"]

[tool.coverage.run]
branch = true
source = ["universal_cutup"]

[tool.coverage.report]
fail_under = 85
show_missing = true
